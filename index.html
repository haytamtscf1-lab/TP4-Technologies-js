<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TP4 - Gestion des commandes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <header class="app-header">
    <div class="container">
      <h1 class="h2">Tableau de bord des commandes</h1>
      <p>Clients, produits et commandes reliés par leurs identifiants</p>
    </div>
  </header>

  <main class="container app-main pb-5">

    <div id="error" class="alert alert-danger d-none"></div>

    <div id="main-content">

      <div id="stats" class="row row-cols-2 row-cols-md-4 g-3 mb-4"></div>

      <div class="card mb-4">
        <div class="card-header">Recherche et filtres</div>
        <div class="card-body row g-3 align-items-end">
          <div class="col-md-4">
            <label for="search" class="form-label">Rechercher un client</label>
            <input id="search" type="search" class="form-control" placeholder="Ex : Nadia">
          </div>
          <div class="col-md-3">
            <label for="status-filter" class="form-label">Statut</label>
            <select id="status-filter" class="form-select"></select>
          </div>
          <div class="col-md-3">
            <label for="category-filter" class="form-label">Catégorie</label>
            <select id="category-filter" class="form-select"></select>
          </div>
          <div class="col-md-2 d-grid">
            <button id="reset" class="btn">Réinitialiser</button>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">Liste des commandes</div>
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead>
              <tr>
                <th>N°</th><th>Client</th><th>Date</th><th>Statut</th>
                <th class="text-end">Total</th><th></th>
              </tr>
            </thead>
            <tbody id="orders-body"></tbody>
          </table>
        </div>
      </div>

    </div>
  </main>

  <div class="modal fade" id="detail-modal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 id="detail-title" class="modal-title"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div id="detail-body" class="modal-body"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
