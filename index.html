<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TP4 - Gestion des commandes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="container py-4">
    <h1 class="h3 mb-4">Tableau de bord des commandes</h1>

    
    <div id="error" class="alert alert-danger d-none"></div>

    <div id="main-content">
     
      <div id="stats" class="row row-cols-2 row-cols-md-4 g-3 mb-4"></div>

     
      <div class="card">
        <div class="card-header fw-semibold">Commandes</div>
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>N°</th><th>Client</th><th>Date</th><th>Statut</th>
                <th class="text-end">Total</th><th></th>
              </tr>
            </thead>
            <tbody id="orders-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
